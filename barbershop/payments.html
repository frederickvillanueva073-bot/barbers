<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - Barbershop Queue System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <span class="brand">Barbershop</span>
        <a href="home.html">Home</a>
        <a href="customers.html">Customers</a>
        <a href="barbers.html">Barbers</a>
        <a href="queue.html">Queue</a>
        <a href="payments.html" class="active">Payments</a>
        <button class="logout" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Record Payment</h2>
            <p>Only finished (Done) services that are not yet paid are shown.</p>
            <form id="paymentForm">
                <label for="queueItem">Finished Service</label>
                <select id="queueItem"></select>

                <label for="total">Total Amount</label>
                <input type="text" id="total" readonly>

                <label for="method">Payment Method</label>
                <select id="method">
                    <option value="">-- Select method --</option>
                    <option value="Cash">Cash</option>
                    <option value="GCash">GCash</option>
                    <option value="Card">Card</option>
                </select>

                <label for="amountPaid">Amount Paid</label>
                <input type="number" id="amountPaid" min="0" step="0.01" placeholder="0.00">

                <p class="error" id="error"></p>
                <p class="success" id="message"></p>
                <button type="submit">Save Payment</button>
            </form>
        </div>

        <div class="card">
            <h2>Payment History</h2>
            <div class="toolbar">
                <input type="text" id="search" placeholder="Search customer or queue no...">
                <select id="filterMethod">
                    <option value="">All Methods</option>
                    <option value="Cash">Cash</option>
                    <option value="GCash">GCash</option>
                    <option value="Card">Card</option>
                </select>
                <input type="date" id="filterDate">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Queue No.</th>
                            <th>Customer</th>
                            <th>Service</th>
                            <th>Total</th>
                            <th>Paid</th>
                            <th>Change</th>
                            <th>Method</th>
                        </tr>
                    </thead>
                    <tbody id="paymentTable"></tbody>
                </table>
            </div>
            <h3>Total Sales (shown above): <span id="totalSales">₱0.00</span></h3>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="payments.js"></script>
</body>

</html>
